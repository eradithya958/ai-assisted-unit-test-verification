[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quality_assessment"
version = "0.1.0"
description = "Software Quality & Verification Assessment Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.mutmut]
source_paths = ["src/quality_assessment"]

