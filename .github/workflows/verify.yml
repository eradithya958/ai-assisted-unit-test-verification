name: Verification & Mutation Testing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test Suites, Coverage & Mutation Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Manual Test Suite & Branch Coverage
        run: |
          pytest tests/manual/ --cov=quality_assessment --cov-report=term-missing --cov-report=xml:coverage-manual.xml

      - name: Run AI-Generated Test Suite
        run: |
          pytest tests/ai_generated/ --cov=quality_assessment --cov-report=term-missing

      - name: Run Hybrid (AI + Human Review) Test Suite
        run: |
          pytest tests/hybrid/ --cov=quality_assessment --cov-report=term-missing --cov-report=xml:coverage-hybrid.xml

      - name: Run CI Mutation Testing Regression Check
        run: |
          python scripts/ci_mutation_check.py

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-coverage-reports
          path: |
            coverage-manual.xml
            coverage-hybrid.xml
            results/
